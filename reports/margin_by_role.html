<title>Margin by role</title>
<style>
  body { margin: 0; background: #fff; font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
  #wrap { display: inline-block; background: #fff; padding: 12px 16px; }
  .legend { display: flex; gap: 20px; font-size: 13px; color: #52514e; margin: 0 0 10px 4px; align-items: center; }
  .legend .key { display: inline-flex; align-items: center; gap: 7px; }
  svg { display: block; }
</style>
<div id="wrap">
  <div class="legend" id="legend"></div>
  <div id="chart"></div>
</div>
<script>
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const txt = (x, y, s, a) => { const t = el("text", Object.assign({ x, y, "font-size": 12, fill: "#898781" }, a || {})); t.textContent = s; return t; };
  const BLUE = "#2a78d6", LIGHT = "#9EC5F4", RED = "#e34948", INK = "#0b0b0b", INK2 = "#52514e", GRID = "#e1e0d9";
  // name, class, loaded cost, bill rate, multiplier, underwater
  const DATA = [
    ["Kevin Metts", "Designer II", 123.62, 95.70, "0.77×", true],
    ["Bhkti Patel", "Engineer III", 143.97, 152.21, "1.06×", false],
    ["Francis Wagner", "Engineer III", 143.97, 152.21, "1.06×", false],
    ["Craig Peterson", "Engineer I", 103.24, 112.27, "1.09×", false],
    ["Collin Allen", "Graphics Tech", 68.39, 76.14, "1.11×", false],
    ["Hayley Worthen", "Senior Engineer", 184.71, 241.57, "1.31×", false],
    ["Taylor Nelson", "Engineer II (bill)", 103.24, 138.09, "1.34×", false],
    ["Roy Pierce", "Principal Engineer", 200.12, 360.72, "1.80×", false],
  ];
  const W = 930, ROW = 46, L = 168, R = 96, T = 8, PW = W - L - R;
  const H = T + DATA.length * ROW + 26, XMAX = 380;
  const x = v => L + v / XMAX * PW;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img",
    "aria-label": "Loaded labor cost versus bill rate by person" });
  document.getElementById("chart").appendChild(svg);
  [0, 100, 200, 300].forEach(v => {
    svg.appendChild(el("line", { x1: x(v), x2: x(v), y1: T, y2: T + DATA.length * ROW, stroke: GRID, "stroke-width": 1 }));
    svg.appendChild(txt(x(v), H - 6, "$" + v, { "text-anchor": "middle" }));
  });
  DATA.forEach((d, i) => {
    const [name, cls, cost, bill, mult, under] = d;
    const cy = T + i * ROW + ROW / 2;
    svg.appendChild(txt(L - 10, cy - 2, name, { "text-anchor": "end", "font-size": 12.5, fill: INK2, "font-weight": 600 }));
    svg.appendChild(txt(L - 10, cy + 13, cls, { "text-anchor": "end", "font-size": 10.5, fill: "#898781" }));
    // bill rate bar (light, back), then loaded cost (blue/red, front)
    const bh = 12;
    svg.appendChild(el("rect", { x: x(0), y: cy - bh - 2, width: Math.max(2, x(bill) - x(0)), height: bh, rx: 3, fill: LIGHT }));
    svg.appendChild(el("rect", { x: x(0), y: cy + 2, width: Math.max(2, x(cost) - x(0)), height: bh, rx: 3, fill: under ? RED : BLUE }));
    svg.appendChild(txt(x(bill) + 6, cy + 4, "$" + bill.toFixed(0), { "font-size": 11, fill: INK, "font-weight": 600 }));
    // multiplier chip at far right
    svg.appendChild(txt(W - 6, cy + 2, mult, { "text-anchor": "end", "font-size": 13, fill: under ? RED : INK, "font-weight": 700 }));
  });
  const lg = document.getElementById("legend");
  [["Bill rate (card)", LIGHT], ["Loaded cost (raw × 1.338)", BLUE], ["Bills below cost", RED]].forEach(([t, c]) => {
    const k = document.createElement("span"); k.className = "key";
    const sv = document.createElementNS(NS, "svg"); sv.setAttribute("width", 14); sv.setAttribute("height", 12); sv.setAttribute("viewBox", "0 0 14 12");
    sv.appendChild(el("rect", { x: 0, y: 0, width: 14, height: 12, rx: 3, fill: c }));
    k.appendChild(sv); k.appendChild(document.createTextNode(t)); lg.appendChild(k);
  });
})();
</script>
